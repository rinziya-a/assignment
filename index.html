<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #585d70, #ac91c7);
        }

        .calculator {
            width: 350px;
            padding: 25px;
            background: #222;
            border-radius: 20px;
            box-shadow: 0 8px 20px #333;
        }

        #display {
            width: 100%;
            height: 65px;
            margin-bottom: 18px;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #eee;
            color: #222;
            font-size: 28px;
            text-align: right;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 55px;
            border: none;
            border-radius: 8px;
            background: #444;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        button:hover {
            background: #b9aeae;
            color: #222;
        }

        .clear {
            background: #e74c3c;
        }

        .operator {
            background: #ff9800;
        }

        .equal {
            background: #20ad60;
            grid-row: span 2;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <input type="text" id="display" readonly>

        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="deleteLast()">DEL</button>
            <button class="operator" onclick="addValue('%')">%</button>
            <button class="operator" onclick="addValue('/')">÷</button>

            <button onclick="addValue('7')">7</button>
            <button onclick="addValue('8')">8</button>
            <button onclick="addValue('9')">9</button>
            <button class="operator" onclick="addValue('*')">×</button>

            <button onclick="addValue('4')">4</button>
            <button onclick="addValue('5')">5</button>
            <button onclick="addValue('6')">6</button>
            <button class="operator" onclick="addValue('-')">−</button>

            <button onclick="addValue('1')">1</button>
            <button onclick="addValue('2')">2</button>
            <button onclick="addValue('3')">3</button>
            <button class="operator" onclick="addValue('+')">+</button>

            <button class="zero" onclick="addValue('0')">0</button>
            <button onclick="addValue('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>

        </div>
    </div>

    <script>
        const display = document.getElementById("display");

        // Display numbers and operators
        function addValue(num) {
            display.value = display.value + num;
        }

        // Clear display
        function clearDisplay() {
            display.value = "";
        }

        // Delete the last character
        function deleteLast() {
            display.value = display.value.slice(0, -1);
        }

        // Calculate the result
        function calculate() {
            const expression = display.value;
            const parts = expression.split(/([+\-*/%])/);

            if (parts.length !== 3 ||
                parts[0] === "" ||
                parts[2] === "") {
                display.value = "Error";
                return;
            }

            const num1 = Number(parts[0]);
            const operator = parts[1];
            const num2 = Number(parts[2]);
            let result;

            if (operator === "+") {
                result = num1 + num2;
            } else if (operator === "-") {
                result = num1 - num2;
            } else if (operator === "*") {
                result = num1 * num2;
            } else if (operator === "/") {
                if (num2 === 0) {
                    display.value = "Cannot divide by zero";
                    return;
                }
                result = num1 / num2;
            } else if (operator === "%") {
                if (num2 === 0) {
                    display.value = "Cannot divide by zero";
                    return;
                }
                result = num1 % num2;
            } else {
                display.value = "Error";
                return;
            }

            display.value = result;
        }
    </script>

</body>
</html>
